<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: transparent;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-app-region: no-drag;
      }

      .marker {
        position: relative;
        width: 16px;
        height: 16px;
      }

      .marker-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d4956a;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        box-shadow: 0 0 6px 2px rgba(212, 149, 106, 0.8);
      }

      .marker-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid rgba(212, 149, 106, 0.9);
        animation: pulse-ring 1.8s ease-out infinite;
      }

      .marker-ring:nth-child(2) { animation-delay: 0.6s; }
      .marker-ring:nth-child(3) { animation-delay: 1.2s; }

      @keyframes pulse-ring {
        0% { width: 10px; height: 10px; opacity: 0.9; border-color: rgba(212,149,106,0.9); }
        100% { width: 60px; height: 60px; opacity: 0; border-color: rgba(212,149,106,0); margin-top: -25px; margin-left: -25px; }
      }

      .marker-float {
        animation: float 3s ease-in-out infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
    </style>
  </head>
  <body>
    <div class="marker-float">
      <div class="marker">
        <div class="marker-ring"></div>
        <div class="marker-ring"></div>
        <div class="marker-ring"></div>
        <div class="marker-dot"></div>
      </div>
    </div>
  </body>
</html>
