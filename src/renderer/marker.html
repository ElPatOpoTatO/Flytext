<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: transparent;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-app-region: no-drag;
      }

      .marker {
        position: relative;
        width: 6px;
        height: 6px;
      }

      .marker-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d4956a;
        opacity: 0.65;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 4px rgba(212, 149, 106, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="marker">
      <div class="marker-dot"></div>
    </div>
  </body>
</html>
